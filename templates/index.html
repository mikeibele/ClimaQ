<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClimaQ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #87CEEB;
            color: #ffffff;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 80%;
            max-width: 400px;
            padding: 10px;
            border-radius: 25px;
            border: none;
            margin-right: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            border-radius: 25px;
            border: none;
            background-color: #1e90ff;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #4682b4;
        }

        .weather-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .weather-card {
            flex: 0 1 calc(25% - 15px);
            max-width: 100%;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            border-radius: 15px;
            padding: 20px;
            color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .weather-card a {
            text-decoration: none;
            color: inherit;
        }
    </style>
</head>
<body>
    <h1>ClimaQ</h1>
    <form method="POST" action="/">
        <input type="text" name="search" placeholder="Search for a city or airport" required>
        <button type="submit">Search</button>
    </form>

    <div class="weather-container">
        {% for weather in other_weather %}
        <div class="weather-card">
            <a href="/weather/{{ weather.city }}">
                <h3>{{ weather.city }}</h3>
                <p>{{ weather.temperature }}°</p>
                <p>{{ weather.description }}</p>
                <div class="weather-details">
                    <p>H: {{ weather.high }}° L: {{ weather.low }}°</p>
                </div>
            </a>
        </div>
        {% endfor %}
    </div>
</body>
</html>
